# Windows build of the app (PyInstaller; the C++ port has its own in YajatGhule/memecam-cpp). Run it from the
# Actions tab ("Run workflow") to get the zip as a build artifact; push a tag like v1.0 to also publish it as
# a GitHub Release.
name: Windows builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sounds:
    # The meme sounds are copyrighted clips and not in the repos; fetch them for the builds (best effort:
    # YouTube sometimes refuses CI machines, then the builds are simply silent).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pipx install yt-dlp
          tools/fetch_sounds.sh || true
          ls assets/sounds
      - uses: actions/upload-artifact@v4
        with:
          name: sounds
          path: assets/sounds/*.wav
          if-no-files-found: ignore

  python:
    needs: sounds
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: sounds, path: assets/sounds }
      - uses: astral-sh/setup-uv@v6
      - name: Build
        shell: bash
        run: |
          uv sync --no-dev --python 3.12
          uv run --no-dev python -c "from memecam.tracking import MODELS, model_path; [model_path(m) for m in MODELS]"
          uv run --no-dev --with pyinstaller pyinstaller packaging/memecam.spec --noconfirm
          cp dist/memecam/memecam.exe dist/memecam/memecamv2.exe
          cp README.md dist/memecam/
      - name: Smoke test
        shell: bash
        run: dist/memecam/memecam.exe --help
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/memecam -DestinationPath MemeCam-Python-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: MemeCam-Python-Windows, path: MemeCam-Python-Windows.zip }
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Meme Cam $GITHUB_REF_NAME" --notes "Windows builds: unzip, then double-click memecam.exe (or memecamv2.exe for the Godfather / looksmaxxing memes). The faster single-person C++ port has its own releases: https://github.com/YajatGhule/memecam-cpp/releases. No install needed. Linux / macOS: see the README for the one-line installers." || true
          gh release upload "$GITHUB_REF_NAME" MemeCam-Python-Windows.zip --repo "$GITHUB_REPOSITORY" --clobber
