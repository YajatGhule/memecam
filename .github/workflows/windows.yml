# Windows builds of both versions: the Python app (PyInstaller) and the C++ port (YajatGhule/memecam-cpp,
# MSVC + LiteRT + prebuilt OpenCV). Run it from the Actions tab ("Run workflow") to get the zips as build
# artifacts; push a tag like v1.0 to also publish them as a GitHub Release.
name: Windows builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sounds:
    # The meme sounds are copyrighted clips and not in the repos; fetch them for the builds (best effort:
    # YouTube sometimes refuses CI machines, then the builds are simply silent).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pipx install yt-dlp
          tools/fetch_sounds.sh || true
          ls assets/sounds
      - uses: actions/upload-artifact@v4
        with:
          name: sounds
          path: assets/sounds/*.wav
          if-no-files-found: ignore

  python:
    needs: sounds
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: sounds, path: assets/sounds }
      - uses: astral-sh/setup-uv@v6
      - name: Build
        shell: bash
        run: |
          uv sync --no-dev --python 3.12
          uv run --no-dev python -c "from memecam.tracking import MODELS, model_path; [model_path(m) for m in MODELS]"
          uv run --no-dev --with pyinstaller pyinstaller packaging/memecam.spec --noconfirm
          cp dist/memecam/memecam.exe dist/memecam/memecamv2.exe
          cp README.md dist/memecam/
      - name: Smoke test
        shell: bash
        run: dist/memecam/memecam.exe --help
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/memecam -DestinationPath MemeCam-Python-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: MemeCam-Python-Windows, path: MemeCam-Python-Windows.zip }

  cpp:
    needs: sounds
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      OPENCV_VERSION: 4.12.0
    steps:
      - uses: actions/checkout@v4
        with: { repository: YajatGhule/memecam-cpp, path: cpp }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: sounds, path: cpp/assets/sounds }
      - name: OpenCV (prebuilt)
        shell: bash
        run: |
          curl -fsSL -o opencv.exe "https://github.com/opencv/opencv/releases/download/$OPENCV_VERSION/opencv-$OPENCV_VERSION-windows.exe"
          ./opencv.exe -o"C:\\opencv" -y > /dev/null
          ls /c/opencv/opencv/build/x64
      - name: LiteRT sources + models
        shell: bash
        working-directory: cpp
        run: |
          tools/build_litert.sh
          python - <<'EOF'
          import io, urllib.request, zipfile, pathlib
          base = "https://storage.googleapis.com/mediapipe-models"
          urls = [f"{base}/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task",
                  f"{base}/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
                  f"{base}/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"]
          out = pathlib.Path("models"); out.mkdir(exist_ok=True)
          def unpack(data):
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for n in z.namelist():
                      if n.endswith(".tflite"): (out / pathlib.Path(n).name).write_bytes(z.read(n))
                      elif n.endswith(".task"): unpack(z.read(n))
          for u in urls: unpack(urllib.request.urlopen(u).read())
          print(sorted(p.name for p in out.iterdir()))
          EOF
      - name: Build
        shell: bash
        working-directory: cpp
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR="C:/opencv/opencv/build"
          cmake --build build --config Release --target memecam memecamv2 --parallel
      - name: Package
        shell: bash
        working-directory: cpp
        run: |
          d=../MemeCam-cpp
          mkdir -p $d
          cp build/Release/memecam.exe build/Release/memecamv2.exe $d/
          cp /c/opencv/opencv/build/x64/vc16/bin/opencv_world*.dll $d/
          cp /c/opencv/opencv/build/x64/vc16/bin/opencv_videoio_ffmpeg*.dll $d/ || true
          rm -f $d/opencv_world*d.dll
          cp -r config assets models README.md $d/
          $d/memecam.exe --help
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path MemeCam-cpp -DestinationPath MemeCam-cpp-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: MemeCam-cpp-Windows, path: MemeCam-cpp-Windows.zip }

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [python, cpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: MemeCam-*, merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" MemeCam-*.zip --repo "$GITHUB_REPOSITORY" --title "Meme Cam $GITHUB_REF_NAME" \
            --notes "Windows builds. Unzip, then double-click memecam.exe (or memecamv2.exe). MemeCam-Python = the original app; MemeCam-cpp = the faster single-person C++ port."
