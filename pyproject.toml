[project]
name = "memecam"
version = "0.1.0"
description = "Gesture-triggered meme webcam with mocap-style tracking markers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.30,<1",          # 1.x wheels get SIGKILLed on task creation (Linux 7.2)
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy",
    "pyvirtualcam>=0.11",
]

[project.scripts]
memecam = "memecam.main:main"
memecamv2 = "memecam.main:main_v2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memecam"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]   # not cpp/third_party (LiteRT sources)
