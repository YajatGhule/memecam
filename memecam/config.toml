# Meme Cam config. Edit and restart; drop your own files into assets/ to swap memes.
#
# placement:  tl / tr / bl / br  = corner panel
#             beside             = panel next to whatever triggered it (your hand / face)
#             face               = warped over your face
#             over_face          = the gif itself (not warped) on top of your face, following it
#             center             = big transparent overlay centered over your chest (no frame)
#             cinema             = black & white + "ABSOLUTE CINEMA" caption, plus a corner panel
# height:     panel height as a fraction of the frame height
# hold:       seconds the pose must be held before it fires
# memes only show while the action is being done (a short `linger`, default 0.3 s, rides out
#             tracking dropouts); each time it starts again the gif plays from its first frame

[camera]
index = 0
width = 1280
height = 720
mirror = true

[tracking]
device = "auto"         # auto = dedicated NVIDIA/AMD GPU if present, else CPU; or "gpu" / "cpu"

[people]
max_people = 3          # track up to this many people; each one's memes fire on their own
min_face_width = 0.08   # ignore faces narrower than this fraction of the frame width (people in the background)
forget = 1.0            # seconds a person who drops out keeps their id (tracking dropouts only; nothing of theirs is drawn meanwhile)

[display]
meme_on_face = true     # every meme goes on top of the face of whoever triggered it (overrides placement;
                        # absolute cinema still turns the frame black & white). false = use each placement

[thresholds]
finger_extended_ratio = 1.15
cover_dist = 0.75       # hand this close to nose/mouth (face-widths) = covering it
cross_dist = 0.25       # gojo: crossed fingertips this close (hand-sizes)
peace_gap = 0.35        # V sign (no meme): fingertips at least this far apart (hand-sizes)
head_tilt_up = 0.10     # dafoe: how far back the head must tilt
motion = 0.07           # talking to a wall: how much of the frame must be moving
hand_speed = 3.0        # talking to a wall: wrist speed (face-widths / second)
mahoraga_dist = 1.85    # mahoraga: knuckles this close (face-widths)
bounce_speed = 1.0      # 67: hands bouncing in alternation at least this fast (face-widths / second)

[memes.higuruma]          # both hands over your face
asset = "higuruma_giving_up.gif"
title = "HIGURUMA"
frames = [114, 176]       # starts on the close-up with his hands already on his face...
loop_from = 140           # ...then keep shifting a little
placement = "tl"
height = 0.38

[memes.dafoe]             # tilt your head back and look up
asset = "dafoe_lookup.gif"
title = "WILLEM DAFOE"
placement = "tr"
height = 0.34
hold = 0.45               # a quick lean back while moving isn't a look up

[memes.gojo]              # index + middle finger crossed (Infinite Void sign)
asset = "gojo_nah_id_win_manga.png"
title = "NAH, I'D WIN"
placement = "bl"
height = 0.45
hold = 0.4

[memes.nerd]              # index finger pointing up ☝
asset = "nerd_finger_up.png"
title = ""
placement = "beside"
height = 0.42

[memes.talking_to_wall]   # talk while waving your hands around a lot (mouth AND hands moving)
asset = "man_talking_to_wall.gif"
title = "TALKING TO A WALL"
placement = "beside"      # "face" warps it over your face instead
height = 0.45
hold = 0.5

[memes.scuba_cat]         # one hand held still over mouth/nose, the other hand swimming around
asset = "scuba_cat.gif"
title = "SCUBA CAT"
placement = "beside"
height = 0.6

[memes.absolute_cinema]   # both open palms up beside your head
asset = "absolute_cinema.gif"
title = "ABSOLUTE CINEMA"
placement = "cinema"
height = 0.3

[memes.mahoraga]          # two fists knuckle to knuckle in front of your chest (Megumi's sign)
asset = "megumi_mahoraga.gif"
title = "WITH THIS TREASURE I SUMMON..."
placement = "br"
height = 0.42
hold = 0.5

[memes.thumbs_up]         # thumbs up 👍
asset = "thumbs_up_dad.gif"
title = "THUMBS UP DAD"
placement = "beside"
height = 0.38

[memes.middle_finger]     # 🖕
asset = "thinkpad_middle_finger.png"
title = "THINKPAD SAYS"
placement = "beside"
height = 0.4
hold = 0.25

[memes.sixty_seven]       # open palms up at chest height, bouncing up and down in alternation (six seven)
asset = "sixty_seven.png"
title = ""
placement = "center"
height = 0.5
hold = 0.4
